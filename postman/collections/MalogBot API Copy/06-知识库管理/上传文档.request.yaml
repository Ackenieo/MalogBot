$kind: http-request
name: 上传文档
method: POST
url: '{{base_url}}/knowledge-bases/{{kb_id}}/documents'
description: |-
  向指定知识库上传文档，支持格式：.txt .md .json .csv .pdf .doc .docx
  返回 status, message, document_id, chunk_count
order: 6000
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
      description: '上传的文档文件，支持 .txt .md .json .csv .pdf .doc .docx'
