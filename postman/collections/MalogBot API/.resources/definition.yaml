$kind: collection
name: MalogBot API
description: |-
  MalogBot 后端接口集合 — 基于 RAG 和智能 Agent 的知识管理助手
  
  包含以下模块：
  - 会话管理
  - 对话接口（流式/非流式）
  - 命令确认机制
  - 任务继续执行
  - 联网搜索控制
  - 知识库管理
  - 多Agent团队协作
  - 监控指标
variables:
  - key: base_url
    value: 'http://localhost:5000'
    description: MalogBot API 基础地址
  - key: session_id
    value: ''
    description: 当前会话 ID
  - key: kb_id
    value: ''
    description: 知识库 ID
  - key: doc_id
    value: ''
    description: 文档 ID
  - key: hours
    value: '24'
    description: 查询小时数
  - key: limit
    value: '20'
    description: 查询条数限制
