openapi: 3.0.0
info:
  title: MalogBot API Doc
  version: 1.0.0
  description: |-
    MalogBot 后端接口集合 — 基于 RAG 和智能 Agent 的知识管理助手

    包含以下模块：
    - 会话管理
    - 对话接口（流式/非流式）
    - 命令确认机制
    - 任务继续执行
    - 联网搜索控制
    - 知识库管理
    - 多Agent团队协作
    - 监控指标
servers:
  - url: 'http://localhost:5000'
paths:
  /sessions:
    get:
      summary: 获取所有会话列表
      responses: {}
      tags:
        - 01-会话管理
      description: 获取所有会话列表，返回 sessions 列表和 current_session_id
  /sessions/new:
    post:
      summary: 创建新会话
      responses: {}
      tags:
        - 01-会话管理
      description: '创建新会话，返回 status, session_id, message'
  '/sessions/{session_id}':
    delete:
      summary: 删除会话
      responses: {}
      tags:
        - 01-会话管理
      description: '删除指定会话，返回 status, message'
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        example: ''
  '/sessions/{session_id}/switch':
    post:
      summary: 切换会话
      responses: {}
      tags:
        - 01-会话管理
      description: '切换到指定会话，返回 status, session_id, session_info'
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        example: ''
  '/sessions/{session_id}/info':
    get:
      summary: 获取会话详情
      responses: {}
      tags:
        - 01-会话管理
      description: '获取指定会话详情，返回 session_info, messages'
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        example: ''
  '/sessions/{session_id}/knowledge-base':
    get:
      summary: 获取会话知识库设置
      responses: {}
      tags:
        - 01-会话管理
      description: '获取指定会话的知识库设置，返回 knowledge_base_id, knowledge_base'
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
        example: ''
    put:
      summary: 设置会话知识库
      responses: {}
      tags:
        - 01-会话管理
      description: '为指定会话设置知识库，返回 status, knowledge_base_id, message'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                knowledge_base_id:
                  type: string
            example:
              knowledge_base_id: ''
  /chat:
    post:
      summary: 非流式对话
      responses: {}
      tags:
        - 02-对话接口
      description: '非流式对话接口，返回 type(response/confirmation_required/onboarding_required/error), output'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
            example:
              message: 你好，请介绍一下你自己
  /chat/stream:
    post:
      summary: 流式对话-SSE
      responses: {}
      tags:
        - 02-对话接口
      description: |-
        使用 Server-Sent Events 流式返回对话内容。
        返回 Content-Type: text/event-stream，每个 chunk 格式为 data: {...}\n\n
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
            example:
              message: 你好，请介绍一下你自己
  /history:
    get:
      summary: 获取对话历史
      responses: {}
      tags:
        - 02-对话接口
      description: '获取当前会话的对话历史，返回 messages, session_id'
  /reset:
    post:
      summary: 重置会话历史
      responses: {}
      tags:
        - 02-对话接口
      description: '重置当前会话的对话历史，返回 status, message'
  /stop:
    post:
      summary: 取消流式输出
      responses: {}
      tags:
        - 02-对话接口
      description: '取消当前正在进行的流式输出，返回 status, message'
  /onboarding/reply:
    post:
      summary: 首次引导回复
      responses: {}
      tags:
        - 02-对话接口
      description: '首次使用时的引导回复接口，返回 type, output, onboarding_completed'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
            example:
              message: 我是一名后端开发工程师，主要使用 Python
  /confirm:
    post:
      summary: 确认执行命令-非流式
      responses: {}
      tags:
        - 03-命令确认
      description: '确认执行命令（非流式），返回 type, output'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                user_message:
                  type: string
            example:
              command: ls -la
              user_message: 查看当前目录文件
  /confirm/stream:
    post:
      summary: 确认执行命令-流式
      responses: {}
      tags:
        - 03-命令确认
      description: |-
        确认执行命令（流式 SSE），返回 SSE 流式数据。
        每个 chunk 格式为 data: {...}\n\n
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                user_message:
                  type: string
            example:
              command: ls -la
              user_message: 查看当前目录文件
  /cancel:
    post:
      summary: 取消命令执行
      responses: {}
      tags:
        - 03-命令确认
      description: |-
        取消命令执行，返回 SSE 流式数据（告知用户已取消）。
        每个 chunk 格式为 data: {...}\n\n
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                user_message:
                  type: string
            example:
              command: rm -rf /tmp/test
              user_message: 删除临时文件
  /continue:
    post:
      summary: 继续执行-非流式
      responses: {}
      tags:
        - 04-任务继续
      description: '继续执行上一个任务（非流式），返回 type, output'
  /continue/stream:
    post:
      summary: 继续执行-流式
      responses: {}
      tags:
        - 04-任务继续
      description: |-
        继续执行上一个任务（流式 SSE），返回 SSE 流式数据。
        每个 chunk 格式为 data: {...}\n\n
  /web-search/status:
    get:
      summary: 获取联网搜索状态
      responses: {}
      tags:
        - 05-联网搜索
      description: '获取当前会话的联网搜索开关状态，返回 enabled, session_id'
  /web-search/toggle:
    post:
      summary: 切换联网搜索开关
      responses: {}
      tags:
        - 05-联网搜索
      description: '切换当前会话的联网搜索开关，返回 enabled, session_id, message'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
            example:
              enabled: true
  /knowledge-bases:
    get:
      summary: 获取知识库列表
      responses: {}
      tags:
        - 06-知识库管理
      description: 获取所有知识库列表，返回 knowledge_bases
    post:
      summary: 创建知识库
      responses: {}
      tags:
        - 06-知识库管理
      description: '创建新的知识库，返回 status, knowledge_base'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
            example:
              name: 技术文档库
              description: 存放技术相关文档
  '/knowledge-bases/{kb_id}':
    get:
      summary: 获取知识库详情
      responses: {}
      tags:
        - 06-知识库管理
      description: 获取指定知识库的详情，返回 knowledge_base
    parameters:
      - name: kb_id
        in: path
        required: true
        schema:
          type: string
        example: ''
    delete:
      summary: 删除知识库
      responses: {}
      tags:
        - 06-知识库管理
      description: '删除指定知识库，返回 status, message'
  '/knowledge-bases/{kb_id}/documents':
    get:
      summary: 获取文档列表
      responses: {}
      tags:
        - 06-知识库管理
      description: 获取指定知识库下的文档列表，返回 documents
    parameters:
      - name: kb_id
        in: path
        required: true
        schema:
          type: string
        example: ''
    post:
      summary: 上传文档
      responses: {}
      tags:
        - 06-知识库管理
      description: |-
        向指定知识库上传文档，支持格式：.txt .md .json .csv .pdf .doc .docx
        返回 status, message, document_id, chunk_count
  '/documents/{doc_id}':
    delete:
      summary: 删除文档
      responses: {}
      tags:
        - 06-知识库管理
      description: '删除指定文档，返回 status, message'
    parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
        example: ''
  /team/status:
    get:
      summary: 获取团队执行状态
      responses: {}
      tags:
        - 07-团队协作
      description: '获取多 Agent 团队的当前执行状态，返回 status, team_status'
  /team/task-board:
    get:
      summary: 获取任务看板
      responses: {}
      tags:
        - 07-团队协作
      description: '获取多 Agent 团队的任务看板信息，返回 status, task_board'
  /monitoring/bootstrap:
    get:
      summary: Bootstrap加载指标
      parameters:
        - name: hours
          in: query
          description: 查询时间范围（小时），默认 24
          schema:
            type: string
          example: '{{hours}}'
      responses: {}
      tags:
        - 08-监控指标
      description: '获取 Bootstrap 加载相关指标，返回 status, bootstrap_stats'
  /monitoring/retrieval:
    get:
      summary: 检索指标
      parameters:
        - name: hours
          in: query
          description: 查询时间范围（小时），默认 24
          schema:
            type: string
          example: '{{hours}}'
      responses: {}
      tags:
        - 08-监控指标
      description: '获取检索相关指标，返回 status, retrieval_stats'
  /monitoring/knowledge:
    get:
      summary: 知识库状态指标
      responses: {}
      tags:
        - 08-监控指标
      description: '获取知识库状态相关指标，返回 status, knowledge_metrics'
  /monitoring/alerts:
    get:
      summary: 监控告警
      parameters:
        - name: limit
          in: query
          description: 返回条数限制，默认 20
          schema:
            type: string
          example: '{{limit}}'
      responses: {}
      tags:
        - 08-监控指标
      description: '获取监控告警列表，返回 status, alerts, count'
  /monitoring/prometheus:
    get:
      summary: Prometheus格式导出
      responses: {}
      tags:
        - 08-监控指标
      description: 以 Prometheus 文本格式导出所有监控指标，返回 text/plain 格式数据
